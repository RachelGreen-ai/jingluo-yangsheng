<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>足厥阴肝经 · 经络养生</title>
<style>
  :root{
    --paper:#F4ECD8; --paper-2:#EFE4C9; --paper-3:#EAdfc0;
    --ink:#3a3226; --ink-soft:#6b5f4a; --ink-faint:#8a7a55;
    --gold:#c9a24b; --gold-light:#e8c874; --gold-deep:#a9822f;
    --cinnabar:#b23a2e; --cinnabar-soft:#c86a5c;
    --line:rgba(58,50,38,.16); --line-2:rgba(58,50,38,.28);
    --serif:"Kaiti SC","STKaiti","楷体","BiauKai","Kaiti TC","Noto Serif SC","Songti SC",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --shadow:0 8px 30px rgba(58,50,38,.18);
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:17px}
  html[data-fs="1"]{font-size:19px}
  html[data-fs="2"]{font-size:21.5px}
  body{
    margin:0; font-family:var(--sans); color:var(--ink);
    background:
      radial-gradient(120% 90% at 15% 0%, #FBF5E4 0%, rgba(251,245,228,0) 55%),
      radial-gradient(120% 90% at 90% 20%, #F7EED6 0%, rgba(247,238,214,0) 55%),
      var(--paper);
    line-height:1.7; letter-spacing:.01em;
    min-height:100vh;
  }
  /* faint paper texture */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(120,100,60,.05) 1px, transparent 1.4px);
    background-size:7px 7px;opacity:.7;}
  h1,h2,h3,.serif{font-family:var(--serif)}
  button{font-family:inherit;cursor:pointer}

  .wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 16px 90px}

  /* ---------- Header ---------- */
  header.top{
    position:relative;z-index:30;
    backdrop-filter:blur(8px);
    background:linear-gradient(180deg, rgba(244,236,216,.96), rgba(244,236,216,.82));
    border-bottom:1px solid var(--line);
    margin:0 -16px 14px;padding:12px 16px 10px;
  }
  .titlerow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .title{font-size:1.7rem;font-weight:500;letter-spacing:.1em;margin:0;color:var(--ink)}
  .title .en{font-size:.62em;color:var(--ink-faint);font-family:var(--sans);letter-spacing:.04em;font-weight:600;margin-left:.3em}
  .subtitle{font-size:.82rem;color:var(--ink-faint);letter-spacing:.14em}
  .subtitle b{color:var(--gold-deep);font-weight:700}
  .tools{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .tbtn{
    border:1px solid var(--line-2);background:var(--paper-2);color:var(--ink-soft);
    border-radius:999px;padding:7px 13px;font-size:.8rem;min-height:38px;display:inline-flex;align-items:center;gap:6px;
    transition:.18s;
  }
  .tbtn:hover{background:var(--paper-3);color:var(--ink)}
  .tbtn.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ---------- Layout ---------- */
  .app{display:flex;flex-direction:column;gap:16px}
  @media(min-width:900px){
    .app{flex-direction:row;align-items:flex-start}
    .stage{flex:0 0 44%;position:sticky;top:96px}
    .content{flex:1 1 auto;min-width:0}
  }

  /* ---------- Stage / figure ---------- */
  .stage{background:linear-gradient(180deg,#FBF6E7,#F1E7CC);
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:10px 8px 6px;position:relative;overflow:hidden}
  .stage-hint{text-align:center;font-size:.78rem;color:var(--ink-faint);letter-spacing:.1em;margin:2px 0 -2px}
  .figbox{position:relative;width:100%;max-width:400px;margin:0 auto;border-radius:14px;overflow:hidden;
    box-shadow:0 6px 24px rgba(58,50,38,.18);background:#efe7d6}
  .bodyimg{display:block;width:100%;height:auto}
  .qi{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .overlay{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .stage-top{display:flex;justify-content:center;align-items:center;gap:10px;padding:2px 0 8px}
  .stage-top .lab{font-size:.78rem;color:var(--ink-faint);letter-spacing:.14em}
  .stage-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:6px 4px 8px}
  .chip{border:1px solid var(--line-2);background:var(--paper);color:var(--ink-soft);
    border-radius:999px;padding:7px 14px;font-size:.82rem;min-height:40px;display:inline-flex;align-items:center;gap:6px;transition:.18s}
  .chip:hover{background:var(--paper-3)}
  .chip.on{background:var(--gold);color:#3a2c08;border-color:var(--gold-deep);font-weight:600}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--cinnabar)}
  .seg{display:inline-flex;border:1px solid var(--gold-deep);border-radius:999px;overflow:hidden;background:var(--paper)}
  .seg button{border:none;background:transparent;color:var(--ink-soft);padding:8px 18px;font-size:.86rem;min-height:40px;font-weight:600;letter-spacing:.08em;transition:.18s}
  .seg button.on{background:var(--gold);color:#3a2c08}
  .seg button:not(.on):hover{background:var(--paper-3)}

  /* SVG bits — main figure viewBox 0..100 x 0..200; zoom-detail modal 0..320 */
  .body-line{fill:rgba(255,252,242,.35);stroke:var(--ink-soft);stroke-width:2;stroke-linejoin:round}
  .body-fill{fill:rgba(201,162,75,.06)}

  /* silhouette base body (both modes) */
  .silh{fill:url(#skin);stroke:#b98f5e;stroke-width:.5;stroke-linejoin:round}
  .mode-muscle .silh{fill:#e9cda4;stroke:#c39a6a}
  /* muscle polygons — data: giavinh79/react-body-highlighter (MIT) */
  .mp{stroke:none;transition:fill .35s}
  .mode-skin .mp{fill:url(#skin);stroke:#e0c199;stroke-width:.45}
  .mode-muscle .mp{stroke:#7c3322;stroke-width:.35;stroke-linejoin:round}
  .mode-muscle .m-chest{fill:#cb7256}
  .mode-muscle .m-front_deltoids{fill:#d17e50}
  .mode-muscle .m-biceps{fill:#c66a4b}
  .mode-muscle .m-triceps{fill:#b45f44}
  .mode-muscle .m-forearm{fill:#d07a58}
  .mode-muscle .m-abs{fill:#c26749}
  .mode-muscle .m-obliques{fill:#b96149}
  .mode-muscle .m-neck{fill:#c06f57}
  .mode-muscle .m-head{fill:#e2bf96}
  .mode-muscle .m-quadriceps{fill:#c96f52}
  .mode-muscle .m-abductors{fill:#c06b4f}
  .mode-muscle .m-knees{fill:#d8a97f}
  .mode-muscle .m-calves{fill:#c67254}
  /* relief = muscle definition suggested under skin (skin mode only) */
  .relief{fill:none;stroke:#9c6a3e;stroke-width:.6;opacity:.3;filter:url(#soft);stroke-linejoin:round}
  .mode-muscle .skin-only{display:none}
  .mode-skin .muscle-only{display:none}
  .hi{fill:url(#skinHi);pointer-events:none}
  .feat{fill:none;stroke:#5c4025;stroke-width:.4;stroke-linecap:round;stroke-linejoin:round;opacity:.82}
  .feat-fill{fill:#5c4025;opacity:.72}
  .hair{fill:#5b4630}
  .nail{fill:#f3e6cc;opacity:.9;stroke:#c8a878;stroke-width:.15}
  .mode-muscle .nail{fill:#f0e0c2}
  .crease{fill:none;stroke:#a9835a;stroke-width:.28;opacity:.5;stroke-linecap:round}
  .fiber line{stroke:#7c3322;stroke-width:.22;opacity:.4;stroke-linecap:round}
  .vessel-faint{fill:none;stroke:rgba(201,162,75,.30);stroke-width:.8;stroke-linecap:round}
  .vessel{fill:none;stroke:rgba(201,162,75,.42);stroke-width:1.3;stroke-linecap:round}
  .flow{fill:none;stroke:url(#goldGrad);stroke-width:.9;stroke-linecap:round;
    stroke-dasharray:.5 3;animation:flow 3.2s linear infinite;filter:url(#glow)}
  @keyframes flow{to{stroke-dashoffset:-14}}
  .paused .flow{animation-play-state:paused}
  body.no-anim .flow{animation:none}
  body.no-anim .halo{animation:none}
  .branch{fill:none;stroke:var(--cinnabar-soft);stroke-width:.6;stroke-linecap:round;
    stroke-dasharray:.5 1.8;opacity:0;transition:opacity .4s}
  .show-branch .branch{opacity:.95}
  .branch-lab{opacity:0;transition:opacity .4s}
  .show-branch .branch-lab{opacity:1}
  .origin{fill:none;stroke:#9c4636;stroke-width:.6;stroke-linecap:round;stroke-dasharray:1.5 1.4;opacity:0;transition:opacity .4s}
  .show-origin .origin{opacity:.9}
  .origin-lab{opacity:0;transition:opacity .4s}
  .show-origin .origin-lab{opacity:1}
  .flow-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px}
  .flow-nav .cur{font-family:var(--serif);font-size:1.15rem;color:var(--cinnabar);font-weight:500;padding:0 2px}
  .flow-nav .prev,.flow-nav a{display:inline-flex;align-items:center;gap:4px;padding:8px 13px;border-radius:999px;border:1px solid var(--line-2);font-size:.84rem;text-decoration:none;color:var(--ink-faint);background:var(--paper);min-height:40px}
  .flow-nav a{border-color:var(--gold-deep);color:var(--gold-deep);font-weight:600}
  .flow-nav a:hover{background:var(--gold);color:#3a2c08}

  .halo{fill:var(--cinnabar);opacity:.22;transform-box:fill-box;transform-origin:center;
    animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.22}50%{transform:scale(1.9);opacity:.05}}
  .pt{fill:var(--cinnabar);stroke:#FBF6E7;stroke-width:.4;cursor:pointer;transition:.16s;filter:url(#dotGlow)}
  .pt:hover,.pt.sel{fill:#8f2519}
  .pt.sel{stroke:var(--gold-light);stroke-width:.7}
  .ptlab{font-family:var(--serif);font-size:3.5px;fill:var(--ink);paint-order:stroke;
    stroke:rgba(251,246,231,.92);stroke-width:.9px;pointer-events:none;font-weight:500}
  .cluster{fill:var(--paper);stroke:var(--gold-deep);stroke-width:.5;cursor:pointer}
  .cluster:hover{fill:var(--gold-light)}
  .cluster-lab{font-family:var(--sans);font-size:2.6px;fill:var(--gold-deep);pointer-events:none;font-weight:700}
  /* zoom-detail modal (320-unit) overrides */
  .zpt{stroke-width:1.5px}
  .zlab{font-family:var(--serif);font-size:15px;fill:var(--ink);paint-order:stroke;
    stroke:rgba(251,246,231,.92);stroke-width:3.4px;pointer-events:none;font-weight:500}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:6px;background:var(--paper-2);border:1px solid var(--line);
    border-radius:999px;padding:5px;margin-bottom:14px;overflow-x:auto}
  .tab{flex:1 0 auto;white-space:nowrap;border:none;background:transparent;color:var(--ink-soft);
    border-radius:999px;padding:10px 14px;font-size:.92rem;font-weight:600;min-height:44px;transition:.18s;letter-spacing:.04em}
  .tab.active{background:var(--ink);color:var(--paper)}
  .panel{display:none;animation:fade .35s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card-box{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(58,50,38,.05)}
  .card-box h2{font-size:1.32rem;font-weight:500;margin:0 0 6px;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
  .card-box h2 .mark{width:5px;height:1.05em;background:linear-gradient(var(--gold),var(--gold-deep));border-radius:2px;display:inline-block}
  .card-box h3{font-size:1rem;margin:14px 0 4px;color:var(--gold-deep);letter-spacing:.05em}
  .lead{font-size:.98rem;color:var(--ink-soft)}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
  .badge{background:var(--paper);border:1px solid var(--line-2);border-radius:8px;padding:5px 10px;font-size:.82rem;color:var(--ink-soft)}
  .badge b{color:var(--gold-deep)}
  .flowtext{font-family:var(--serif);font-size:1.05rem;line-height:2;color:var(--ink);
    background:linear-gradient(180deg,rgba(255,252,242,.6),rgba(255,252,242,0));
    padding:10px 12px;border-left:3px solid var(--gold);border-radius:4px}
  .quote{font-family:var(--serif);color:var(--ink-faint);font-size:.86rem;margin-top:6px}

  .list-clean{list-style:none;margin:6px 0 0;padding:0}
  .list-clean li{padding:8px 0 8px 22px;border-bottom:1px dashed var(--line);position:relative;font-size:.95rem}
  .list-clean li:last-child{border-bottom:none}
  .list-clean li::before{content:"";position:absolute;left:4px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
  .list-clean li b{color:var(--ink)}

  .chips-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .pchip{background:var(--paper);border:1px solid var(--cinnabar-soft);color:var(--cinnabar);
    border-radius:999px;padding:6px 13px;font-size:.85rem;min-height:38px;display:inline-flex;align-items:center;gap:5px;font-weight:600;transition:.16s}
  .pchip:hover{background:var(--cinnabar);color:#fff}
  .fchip{background:var(--paper);border:1px solid var(--gold-deep);color:var(--gold-deep);
    border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:600}

  .points-list{display:grid;gap:10px}
  .pcard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;
    background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:.16s}
  .pcard:hover{background:var(--paper-3);border-color:var(--gold);transform:translateX(3px)}
  .pcard.sel{border-color:var(--cinnabar);background:#FBF6E7}
  .pnum{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--cinnabar);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:.9rem;font-weight:700}
  .pinfo{min-width:0}
  .pname{font-family:var(--serif);font-size:1.24rem;font-weight:500;color:var(--ink);letter-spacing:.06em}
  .pname .py{font-family:var(--sans);font-size:.72rem;color:var(--ink-faint);font-weight:600;margin-left:6px;letter-spacing:.03em}
  .ptype{font-size:.78rem;color:var(--gold-deep);font-weight:600}
  .parrow{margin-left:auto;color:var(--ink-faint);font-size:1.2rem}

  /* clock */
  .clockwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .clocktxt{flex:1 1 180px;min-width:160px}
  .clocktxt .big{font-family:var(--serif);font-size:1.5rem;color:var(--cinnabar);font-weight:500;letter-spacing:.08em}
  .clk{font-family:var(--serif)}

  .disclaimer{font-size:.8rem;color:var(--ink-faint);background:var(--paper-2);
    border:1px dashed var(--line-2);border-radius:12px;padding:12px 14px;margin-top:4px;line-height:1.7}

  /* ---------- Detail card (bottom sheet / side panel) ---------- */
  #scrim{position:fixed;inset:0;background:rgba(40,34,24,.45);opacity:0;visibility:hidden;
    transition:.3s;z-index:44;backdrop-filter:blur(1.5px)}
  #scrim.on{opacity:1;visibility:visible}
  #card{position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:linear-gradient(180deg,#FBF6E7,var(--paper));
    border-top:1px solid var(--gold);border-radius:20px 20px 0 0;
    box-shadow:0 -12px 40px rgba(58,50,38,.28);
    transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.7,.2,1);
    max-height:82vh;display:flex;flex-direction:column}
  #card.on{transform:translateY(0)}
  @media(min-width:900px){
    #card{left:auto;top:0;bottom:0;right:0;width:min(420px,92vw);max-height:none;height:100vh;
      border-radius:20px 0 0 20px;border-top:none;border-left:1px solid var(--gold);
      transform:translateX(105%)}
    #card.on{transform:translateX(0)}
  }
  .card-grab{width:44px;height:5px;border-radius:3px;background:var(--line-2);margin:10px auto 2px;flex:0 0 auto}
  @media(min-width:900px){.card-grab{display:none}}
  .card-head{padding:6px 20px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;position:relative}
  .card-close{position:absolute;top:8px;right:14px;width:40px;height:40px;border-radius:50%;
    border:1px solid var(--line-2);background:var(--paper-2);color:var(--ink-soft);font-size:1.2rem;line-height:1}
  .card-close:hover{background:var(--paper-3)}
  .card-title{font-family:var(--serif);font-size:1.9rem;font-weight:500;letter-spacing:.12em;margin:6px 0 2px}
  .card-title .py{font-family:var(--sans);font-size:.5em;color:var(--ink-faint);font-weight:600;margin-left:8px}
  .card-code{font-size:.82rem;color:var(--gold-deep);font-weight:700;letter-spacing:.08em}
  .card-body{padding:14px 20px 26px;overflow-y:auto;flex:1 1 auto}
  .card-body h4{font-size:.82rem;letter-spacing:.14em;color:var(--gold-deep);margin:16px 0 4px;
    text-transform:none;font-family:var(--sans);font-weight:700}
  .card-body h4:first-child{margin-top:4px}
  .card-body p{margin:0;font-size:1rem;color:var(--ink)}
  .card-body .locate{background:var(--paper-2);border-radius:10px;padding:10px 12px;border-left:3px solid var(--gold)}
  .card-body .care{background:#F6EFDB;border-radius:10px;padding:10px 12px;border-left:3px solid var(--cinnabar-soft)}
  .type-tag{display:inline-block;background:var(--ink);color:var(--paper);font-size:.72rem;
    padding:3px 9px;border-radius:6px;margin:0 6px 6px 0;font-weight:600;letter-spacing:.05em}

  /* zoom modal */
  #zoom,#armzoom{position:fixed;inset:0;z-index:48;background:rgba(40,34,24,.5);display:none;
    align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
  #zoom.on,#armzoom.on{display:flex;animation:fade .3s ease}
  .zoom-inner{background:linear-gradient(180deg,#FBF6E7,#F1E7CC);border:1px solid var(--gold);
    border-radius:18px;box-shadow:var(--shadow);max-width:420px;width:100%;max-height:92vh;overflow:auto;padding:14px 14px 18px;position:relative}
  .zoom-inner h3{margin:2px 0 0;text-align:center;font-size:1.15rem;letter-spacing:.06em}
  .zoom-inner .sub{text-align:center;font-size:.8rem;color:var(--ink-faint);margin:2px 0 6px}
  .zoom-close{position:absolute;top:10px;right:12px;width:40px;height:40px;border-radius:50%;
    border:1px solid var(--line-2);background:var(--paper-2);font-size:1.2rem}
  .zsvg{width:100%;height:auto;max-height:64vh}

  .footer{text-align:center;color:var(--ink-faint);font-size:.8rem;margin-top:20px;letter-spacing:.1em}
  .footer .plum{color:var(--cinnabar)}

  /* generic zoom modal (data-driven) */
  .zoommodal{position:fixed;inset:0;z-index:48;background:rgba(40,34,24,.5);display:none;
    align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
  .zoommodal.on{display:flex;animation:fade .3s ease}

/* ── 系统坐标卡（本经在十二经系统中的位置 + 养生逻辑链） ── */
.syscard{--wx:var(--gold);border-left:4px solid var(--wx);position:relative}
.sys-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-bottom:8px}
.wx-tag{flex:none;width:34px;height:34px;border-radius:50%;background:var(--wx);color:#fff;
  font-family:var(--serif);font-size:1.15rem;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(58,50,38,.25)}
.sys-title{font-family:var(--serif);font-size:1.12rem;color:var(--ink);font-weight:500}
.sys-title em{font-style:normal;color:var(--ink-faint);font-size:.9rem}
.sys-zhi{margin-left:auto;font-size:.82rem;color:var(--wx);font-weight:600;white-space:nowrap}
.sys-zhi em{font-style:normal;color:var(--ink-faint);font-weight:400;margin-left:3px}
.sys-wuxing{font-size:.9rem;color:var(--ink-soft);letter-spacing:.03em;margin-bottom:10px;
  padding-bottom:9px;border-bottom:1px dashed var(--line-2)}
.sys-wuxing b{color:var(--wx);font-family:var(--serif);font-size:1.05rem}
.sys-rels{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.sys-chip{display:inline-flex;align-items:baseline;gap:5px;background:var(--paper);
  border:1px solid var(--line-2);border-radius:9px;padding:5px 11px;font-size:.92rem;
  color:var(--ink);text-decoration:none;font-family:var(--serif);transition:.15s}
.sys-chip:hover{border-color:var(--wx);background:#fff}
.sys-chip i{font-style:normal;font-size:.7rem;color:var(--ink-faint);font-family:var(--sans)}
.sys-flow{font-size:.88rem;color:var(--ink-soft);margin-bottom:11px}
.sys-flow a{color:var(--gold-deep);text-decoration:none;border-bottom:1px solid var(--line-2)}
.sys-flow b{color:var(--ink);font-family:var(--serif)}
.sys-logic{font-size:.95rem;line-height:1.75;color:var(--ink);background:var(--paper);
  border-radius:10px;padding:11px 13px}
.sys-logic i{display:block;font-style:normal;font-size:.75rem;color:var(--wx);
  font-family:var(--sans);font-weight:600;letter-spacing:.08em;margin-bottom:3px}
</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <header class="top">

const M = {"key": "lr", "abbr": "LR", "name": "足厥阴肝经", "en": "Liver · LR", "subtitle": "五行属<b>木</b> · <b>丑时</b>（1–3点）当令 · 与胆相表里 · 从足走胸", "clockZhi": "丑", "intro": {"dirTitle": "经络走向 · 从足走胸", "flowtext": "<b>起于足大趾</b>外侧的<b>大敦</b>，沿足背上行，经内踝前方，沿小腿、大腿内侧上行，绕过阴部，进入小腹，夹胃、<b>属肝</b>、络胆，再向上穿过膈，散布于胁肋，止于乳下的<b>期门</b>。", "quote": "肝经向上还连着咽喉后方、连\"目系\"（眼睛与脑相连处）、上出前额，与督脉会于头顶。<br>另有支脉从肝分出，穿过膈、注入肺中，交<b>手太阴肺经</b>——十二经气血流注在此回到起点。", "badges": ["方向：<b>从足 → 胸</b>", "当令：<b>丑时 1–3点</b>", "共 <b>14</b> 穴（每侧）", "五行：<b>木</b>"], "organTitle": "肝是一个怎样的\"脏\"", "organLead": "读懂这几句，就懂了为什么肝经与情绪、眼睛、筋和妇科都相关——", "organ": ["<b>肝主疏泄</b>：调畅全身气机、情绪与消化，肝气条达则心情舒畅、吃得下。", "<b>肝藏血</b>：储藏并调节全身血量，\"人卧则血归于肝\"，熟睡才能养肝血。", "<b>肝主筋、其华在爪</b>：筋腱是否柔韧、指甲是否红润，反映肝血盛衰。", "<b>开窍于目</b>：眼睛干涩、发红、视物模糊，多与肝有关。", "<b>在志为怒</b>：过度愤怒最伤肝，肝火上炎则急躁易怒。", "<b>与胆相表里</b>：肝胆相照，共同负责疏泄与决断。", "<b>丑时（1–3点）肝经当令</b>：此时熟睡，肝才能藏血解毒、自我修复。", "<b>肝为\"将军之官\"</b>：性子刚强易亢奋，需要柔养、忌暴怒与熬夜。"], "pointsTitle": "14 个穴位 · 从大脚趾到胁肋", "flowNav": {"lead": "<b>丑时（1–3点）肝经当令</b>，是肝藏血、解毒、修复的黄金时段；经气随后由肝经传向肺经，回到十二经流注的起点。", "prev": "足少阳胆经（子时）", "next": "手太阴肺经（寅时）", "nextFile": "手太阴肺经.html"}}, "disease": {"title": "病候 · 肝经不通会怎样", "lead": "《灵枢·经脉》把肝经的毛病分成两类，下面是大白话版。", "blocks": [{"h3": "一、是动病（经络气机堵了）", "p": "腰痛得直不起腰、也弯不下腰；男子容易得疝气（小腹坠胀牵引睾丸），女子小腹肿胀；严重时咽喉发干、面色晦暗没有光泽。"}, {"h3": "二、所生病（肝功能失调）", "p": "胸胁胀满、恶心呕吐、腹泻不消化、疝气、遗尿或小便不通。<br>肝气太旺（肝火）→ 头胀头痛、眼红、急躁易怒；<br>肝血不足 → 眼睛干涩、视物模糊、手脚发麻、指甲干枯、情绪低落。"}], "symptoms": [{"label": "胁肋胀痛", "pts": ["LR14", "LR3", "LR13"]}, {"label": "郁闷 · 爱生气", "pts": ["LR3", "LR2"]}, {"label": "眼干 · 眼红胀痛", "pts": ["LR2", "LR3", "LR8"]}, {"label": "头顶痛 · 头晕", "pts": ["LR3"]}, {"label": "高血压 · 烦躁", "pts": ["LR3", "LR2"]}, {"label": "月经不调 · 痛经", "pts": ["LR3", "LR8", "LR6"]}, {"label": "失眠多梦（丑时易醒）", "pts": ["LR3", "LR8"]}, {"label": "消化不良 · 腹胀", "pts": ["LR13", "LR3"]}]}, "care": {"shi": {"title": "丑时（1–3点）肝经当令", "big": "丑时 · 熟睡养肝血", "text": "凌晨 1–3 点气血流注到肝经，是肝\"藏血、解毒、修复\"的黄金时段。此时<b>务必处在熟睡中</b>——\"人卧则血归于肝\"，肝血得养，第二天才有精神、眼睛才明亮。经常这个点醒来、或熬夜不睡，最伤肝血，久之易烦躁、眼干、面色差。"}, "blocks": [{"h2": "日常养肝 · 人人可做", "html": "<h3>不熬夜 · 疏肝解郁</h3><p class=\"lead\">养肝第一要务是<b>丑时前入睡、不熬夜</b>；其次是<b>少发怒、心情舒畅</b>——怒最伤肝。适当散步、伸展、听音乐，让肝气条达不郁结。</p><h3>青色入肝 · 食疗</h3>", "food": ["菠菜", "芹菜", "西兰花", "枸杞", "菊花茶", "玫瑰花茶", "山楂", "乌梅"]}, {"h2": "六字诀与循经保健", "html": "<h3>六字诀 · \"嘘（xū）\"</h3><p class=\"lead\">放松站立，两眼微睁，缓缓呼气时轻念\"<b>嘘（xū）</b>\"，气从两胁缓缓吐出；吸气自然还原。反复 6 次，帮助疏泄肝气、清肝明目、疏解郁闷。</p><h3>循经保健 · 每天几分钟</h3><ul class=\"list-clean\"><li><b>揉太冲、行间：</b>心情烦躁、生气、头胀时，用拇指按揉两侧<b>太冲</b> 2–3 分钟（向行间方向推更泻火），疏肝降火、平稳情绪。</li><li><b>敲肝经：</b>坐着把一条腿架起，沿大腿内侧从根部向膝盖方向轻敲或推揉 2–3 遍，两腿都做，帮助肝经气血通畅。</li><li><b>循经拍打：</b>从足背大脚趾沿小腿、大腿内侧向上，经小腹到两胁<b>期门</b>轻拍，方向\"从足到胸\"，两侧各 2–3 遍。</li></ul>"}], "disclaimer": "温馨提示：本页为传统养生科普，帮助了解经络与日常保健，<b>不能替代医疗诊断与治疗</b>。持续胁痛、皮肤或眼白发黄（黄疸）、剧烈腹痛等请<b>及时就医</b>；孕妇（腹部与三阴交、合谷等穴慎按）、有肝病或特殊体质者，按摩、艾灸等操作前请先咨询专业医师。"}, "points": [{"code": "LR1", "n": 1, "name": "大敦", "py": "Dàdūn", "type": ["井穴·木"], "region": "toe-big", "locate": "大脚趾外侧（靠第二趾一侧）指甲角旁约0.1寸，指甲根角外侧一点点。", "indic": "疝气、小腹痛、遗尿、月经不调、崩漏、癫痫、昏迷急救。是回阳救逆、调理下焦的井穴。", "care": "日常用另一手拇指指甲或钝头轻掐刺激；小腹坠胀、月经量多时可点按。", "x": 47.0, "y": 139.0, "lab": "L", "onMain": true}, {"code": "LR2", "n": 2, "name": "行间", "py": "Xíngjiān", "type": ["荥穴·火"], "region": "foot-dorsum", "locate": "足背，大脚趾与第二趾之间，趾缝纹头稍上方的凹陷。", "indic": "头痛、眩晕、眼睛红肿胀痛、失眠、易怒、痛经、小便不利。清肝火的要穴，上火眼红时常用。", "care": "肝火旺、眼睛红、爱发火时，用拇指从趾缝向脚背方向推揉，清泻肝火。", "x": 47.59, "y": 138.31, "lab": "R", "onMain": true}, {"code": "LR3", "n": 3, "name": "太冲", "py": "Tàichōng", "type": ["原穴·输穴·土", "疏肝要穴"], "region": "foot-dorsum", "locate": "足背，顺着大脚趾与第二趾之间的缝往上摸约两横指，两块跖骨之间的凹陷，能摸到动脉搏动。", "indic": "头痛头晕、高血压、眼干眼胀、月经不调、胁肋胀痛、失眠、烦躁易怒。疏肝理气、平肝降压的第一要穴。", "care": "心情郁闷、生气、头胀时，用拇指从太冲向行间方向推按，或按揉 2–3 分钟，疏肝解郁、平肝降火；配合足底涌泉更好。", "x": 43.81, "y": 132.84, "lab": "L", "onMain": true}, {"code": "LR4", "n": 4, "name": "中封", "py": "Zhōngfēng", "type": ["经穴·金"], "region": "ankle-med", "locate": "内踝前方，脚背与小腿交界处，勾脚时能摸到的那条筋（胫骨前肌腱）内侧的凹陷。", "indic": "内踝肿痛、小便不利、遗精、小腹痛、脚踝扭伤。", "care": "踝前酸痛或小腹不适时，用拇指按揉此处，疏肝通络。", "x": 42.74, "y": 128.16, "lab": "R", "onMain": true}, {"code": "LR5", "n": 5, "name": "蠡沟", "py": "Lígōu", "type": ["络穴"], "region": "leg-med", "locate": "小腿内侧，内踝尖上约五横指（5寸），紧贴胫骨内侧面的正中（贴着骨头）。", "indic": "月经不调、带下、外阴瘙痒、小便不利、小腹胀。\"络穴\"善治肝经与前阴部的问题。", "care": "用拇指沿胫骨内侧面上下按揉，调理下焦、缓解外阴不适。", "x": 43.11, "y": 120.24, "onMain": true}, {"code": "LR6", "n": 6, "name": "中都", "py": "Zhōngdū", "type": ["郄穴"], "region": "leg-med", "locate": "小腿内侧，内踝尖上约七横指（7寸），胫骨内侧面中央。", "indic": "急性胁痛、腹痛、崩漏、恶露不尽、疝气。\"郄穴\"善治急性痛证与出血。", "care": "急性胁痛、痛经时，用拇指用力按压此穴并保持，帮助缓急止痛。", "x": 43.33, "y": 116.26, "onMain": true}, {"code": "LR7", "n": 7, "name": "膝关", "py": "Xīguān", "type": [], "region": "knee-med", "locate": "膝内侧下方，胫骨内侧髁的后下方凹陷，约在阴陵泉后方一横指。", "indic": "膝盖内侧痛、下肢屈伸不利、咽喉痛。", "care": "膝内侧酸痛时，用拇指按揉此处，通利膝关节。", "x": 45.41, "y": 106.55, "onMain": true}, {"code": "LR8", "n": 8, "name": "曲泉", "py": "Qūquán", "type": ["合穴·水"], "region": "knee-med", "locate": "屈膝时，膝内侧横纹头（腘窝内侧端）上方，两条筋前缘的凹陷。", "indic": "月经不调、痛经、带下、阴痒、小便不利、膝内侧痛。是养肝血、调下焦的合穴。", "care": "屈膝，用拇指按揉膝内侧横纹头，滋养肝血、调理妇科不适。", "x": 46.01, "y": 104.55, "onMain": true}, {"code": "LR9", "n": 9, "name": "阴包", "py": "Yīnbāo", "type": [], "region": "thigh-med", "locate": "大腿内侧，膝盖上方约四横指（膝上4寸），两块肌肉之间的凹陷。", "indic": "月经不调、小便不利、腰骶牵引小腹痛、大腿内侧痛。", "care": "用手掌或指腹揉按大腿内侧此处，调经通络。", "x": 46.15, "y": 97.56, "onMain": true}, {"code": "LR10", "n": 10, "name": "足五里", "py": "Zúwǔlǐ", "type": [], "region": "thigh-med", "locate": "大腿内侧根部，气冲（腹股沟动脉搏动处）直下约三横指（3寸）。", "indic": "小腹胀痛、小便不利、阴部湿痒、大腿内侧痛。", "care": "此处靠近大血管，用掌根轻柔按揉即可，不宜重压。", "x": 47.04, "y": 78.07, "k": 1, "lab": "L", "onMain": true}, {"code": "LR11", "n": 11, "name": "阴廉", "py": "Yīnlián", "type": [], "region": "thigh-med", "locate": "大腿内侧根部，气冲直下约两横指（2寸），靠近腹股沟。", "indic": "月经不调、带下、小腹痛、大腿内侧痛、不孕。", "care": "用掌根轻揉大腿根内侧，温经调经。", "x": 47.04, "y": 75.07, "k": 1, "lab": "R", "onMain": true}, {"code": "LR12", "n": 12, "name": "急脉", "py": "Jímài", "type": [], "region": "lower-abdomen", "locate": "腹股沟处，耻骨联合旁开约两横指半（2.5寸），大腿根动脉搏动附近。", "indic": "小腹痛、疝气、外阴痛、大腿内侧痛。", "care": "此处近大血管，只宜<b>轻柔</b>按揉，不可重压；不适明显时请就医。", "x": 46.74, "y": 72.57, "k": 1, "lab": "L", "onMain": true}, {"code": "LR13", "n": 13, "name": "章门", "py": "Zhāngmén", "type": ["脾募穴", "八会穴·脏会"], "region": "flank", "locate": "侧腹部，第11肋游离端下方（屈肘合腋、肘尖大约点到的地方）。", "indic": "腹胀、腹泻、消化不良、胁肋痛、两胁胀满。是脾的\"募穴\"，也是八会穴之\"脏会\"，善调五脏、健脾消胀。", "care": "饭后腹胀、两胁不舒时，用掌根沿肋弓下缘轻揉此处，疏肝健脾、理气消胀。", "x": 38.0, "y": 52.0, "k": 1, "lab": "R", "onMain": true}, {"code": "LR14", "n": 14, "name": "期门", "py": "Qīmén", "type": ["肝募穴"], "region": "rib-side", "locate": "胸部，乳头直下第6肋间隙，前正中线旁开约四横指（4寸）。", "indic": "胸胁胀痛、乳房胀痛、呃逆、腹胀、情绪郁闷。是肝的\"募穴\"，肝气郁结、胸胁胀满时的要穴。", "care": "生闷气、两胁胀痛时，用指腹沿肋间隙轻轻横向按揉，疏肝解郁、理气宽胸。是肝经的终点穴。", "x": 40.0, "y": 45.0, "k": 1, "lab": "L", "onMain": true}], "img": "front", "viewBox": "0 0 100 150", "qi": {"vbw": 100, "vbh": 150, "path": [[47.0, 139.0], [47.59, 138.31], [43.81, 132.84], [42.74, 128.16], [43.11, 120.24], [43.33, 116.26], [45.41, 106.55], [46.01, 104.55], [46.15, 97.56], [47.04, 78.07], [47.04, 75.07], [46.74, 72.57], [38.0, 52.0], [40.0, 45.0]]}, "overlay": {"vessel": "M47,139 L47.59,138.31 L43.81,132.84 L42.74,128.16 L43.11,120.24 L43.33,116.26 L45.41,106.55 L46.01,104.55 L46.15,97.56 L47.04,78.07 L47.04,75.07 L46.74,72.57 L38,52 L40,45", "flow": "M47,139 L47.59,138.31 L43.81,132.84 L42.74,128.16 L43.11,120.24 L43.33,116.26 L45.41,106.55 L46.01,104.55 L46.15,97.56 L47.04,78.07 L47.04,75.07 L46.74,72.57 L38,52 L40,45", "vesselFaint": "M52,139 L51.41,138.31 L55.19,132.84 L56.26,128.16 L55.89,120.24 L55.67,116.26 L53.59,106.55 L52.99,104.55 L52.85,97.56 L51.96,78.07 L51.96,75.07 L52.26,72.57 L61,52 L59,45", "clusters": [{"x": 45.0, "y": 113.0, "label": "腿", "zoom": "leg"}, {"x": 47.0, "y": 134.0, "label": "足", "zoom": "ftD"}]}, "zoom": [{"id": "leg", "chip": "⊕ 足·小腿放大", "title": "足 · 小腿内侧 放大", "sub": "大敦到膝内诸穴（真人图 CC0）", "viewBox": "32.6 93.1 24 31.7", "img": "front", "vessel": "M43.11,120.24 L43.33,116.26 L45.41,106.55 L46.01,104.55 L46.15,97.56", "points": [{"code": "LR5", "x": 43.11, "y": 120.24}, {"code": "LR6", "x": 43.33, "y": 116.26}, {"code": "LR7", "x": 45.41, "y": 106.55}, {"code": "LR8", "x": 46.01, "y": 104.55}, {"code": "LR9", "x": 46.15, "y": 97.56}], "imgH": 150}, {"id": "ftD", "chip": "⊕ 足背放大", "title": "足背 · 大敦·行间·太冲", "sub": "真人足背图（Wikimedia, 公有领域）", "viewBox": "0 0 100 182.8", "img": "footR2", "vessel": "M33,12 L37,31 L39,58", "points": [{"code": "LR1", "x": 33, "y": 12}, {"code": "LR2", "x": 37, "y": 31}, {"code": "LR3", "x": 39, "y": 58}]}, {"id": "ftM", "chip": "⊕ 足内侧放大", "title": "足内侧 · 中封", "sub": "真人足内侧图（Wikimedia, 公有领域）", "viewBox": "0 0 100 74.3", "img": "footR1", "vessel": "", "points": [{"code": "LR4", "x": 50, "y": 28}]}], "system": {"element": "木", "phase": "脏", "yy": "阴", "six": "厥阴", "limb": "足", "organ": "肝", "biao": {"key": "gb", "name": "胆经", "file": "足少阳胆经.html"}, "mother": {"key": "ki", "name": "肾经", "file": "足少阴肾经.html"}, "child": {"key": "ht", "name": "心经", "file": "手少阴心经.html"}, "prev": {"key": "gb", "name": "胆经", "file": "足少阳胆经.html"}, "nxt": {"key": "lung", "name": "肺经", "file": "手太阴肺经.html"}, "zhi": "丑 1–3点", "season": "春", "emotion": "怒", "taste": "酸", "color": "青", "sound": "角", "liu": "嘘 xū", "logic": "肝属木、主疏泄藏血，丑时当令 → 此时熟睡、血归于肝而藏（\"人卧血归肝\"）；怒则伤肝 → 心平气和；春养肝 → 舒展情志，揉太冲疏肝解郁。", "color_hex": "#5c8a52"}};
const SVGNS="http://www.w3.org/2000/svg";
const byCode = {}; M.points.forEach(p=>byCode[p.code]=p);
const N = (v)=>v==null?'':v;

/* ---- header ---- */
document.title = M.name + " · 经络养生";
document.getElementById('hTitle').innerHTML = M.name + '<span class="en">'+N(M.en)+'</span>';
document.getElementById('hSub').innerHTML = M.subtitle;
document.getElementById('footer').innerHTML = '— '+M.name+' · 经络养生 <span class="plum">❁</span> 愿你与家人 气顺神安 —';
if(M.stageHint) document.getElementById('stageHint').textContent = M.stageHint;

/* ---- base image ---- */
const bodyimg = document.getElementById('bodyimg');
bodyimg.src = IMGS[M.img];
const overlay = document.getElementById('overlay');
overlay.setAttribute('viewBox', M.viewBox);

/* ---- overlay: meridian paths ---- */
const ov = M.overlay||{};
const ml = document.getElementById('meridianLayer');
function addPath(cls,d,extra){ const p=document.createElementNS(SVGNS,'path'); p.setAttribute('class',cls); p.setAttribute('d',d); if(extra) for(const k in extra) p.setAttribute(k,extra[k]); ml.appendChild(p); return p; }
if(ov.vesselFaint) addPath('vessel-faint', ov.vesselFaint);
if(ov.vessel) addPath('vessel', ov.vessel);
if(ov.flow) addPath('flow', ov.flow||ov.vessel);
if(ov.origin){
  addPath('origin', ov.origin.d);
  if(ov.origin.marker){ const c=document.createElementNS(SVGNS,'circle'); c.setAttribute('class','origin-lab'); c.setAttribute('cx',ov.origin.marker.x); c.setAttribute('cy',ov.origin.marker.y); c.setAttribute('r','0.9'); c.setAttribute('fill','#9c4636'); ml.appendChild(c); }
  if(ov.origin.label){ const t=document.createElementNS(SVGNS,'text'); t.setAttribute('class','origin-lab ptlab'); t.setAttribute('x',ov.origin.label.x); t.setAttribute('y',ov.origin.label.y); t.setAttribute('font-size','3'); t.setAttribute('text-anchor',ov.origin.label.anchor||'start'); t.textContent=ov.origin.label.text; ml.appendChild(t); }
}
if(ov.branch){
  addPath('branch', ov.branch.d);
  if(ov.branch.label){ const t=document.createElementNS(SVGNS,'text'); t.setAttribute('class','branch-lab ptlab'); t.setAttribute('x',ov.branch.label.x); t.setAttribute('y',ov.branch.label.y); t.setAttribute('font-size','3.2'); t.setAttribute('text-anchor',ov.branch.label.anchor||'end'); t.textContent=ov.branch.label.text; ml.appendChild(t); }
}

/* ---- main-figure points ---- */
const mp = document.getElementById('mainPoints');
M.points.filter(p=>p.x!=null && p.onMain!==false).forEach(p=>{
  const g=document.createElementNS(SVGNS,'g');
  const halo=document.createElementNS(SVGNS,'circle');
  halo.setAttribute('class','halo');halo.setAttribute('cx',p.x);halo.setAttribute('cy',p.y);halo.setAttribute('r','2.3');
  halo.style.animationDelay=((p.n||1)*0.25)+'s';
  const c=document.createElementNS(SVGNS,'circle');
  c.setAttribute('class','pt');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r','1.7');
  c.setAttribute('tabindex','0');c.setAttribute('role','button');c.setAttribute('aria-label',p.name+'穴');c.dataset.code=p.code;
  g.appendChild(halo);g.appendChild(c);
  if(p.k){ // key point: show label on figure
    const t=document.createElementNS(SVGNS,'text'); t.setAttribute('class','ptlab');
    const left = (p.lab==='L')|| (p.lab==null && p.x<50);
    t.setAttribute('x', left ? p.x-2.6 : p.x+2.6);
    t.setAttribute('y', p.y+1.2);
    t.setAttribute('text-anchor', left?'end':'start');
    t.textContent=p.name; g.appendChild(t);
  }
  mp.appendChild(g);
});

/* ---- cluster marker ---- */
if(ov.cluster){
  const cl=document.getElementById('clusterLayer');
  const g=document.createElementNS(SVGNS,'g'); g.setAttribute('tabindex','0'); g.setAttribute('role','button'); g.setAttribute('aria-label',ov.cluster.label+'，点击放大'); g.id='clusterMarker';
  const halo=document.createElementNS(SVGNS,'circle'); halo.setAttribute('class','halo'); halo.setAttribute('cx',ov.cluster.x); halo.setAttribute('cy',ov.cluster.y); halo.setAttribute('r','2.2');
  const c=document.createElementNS(SVGNS,'circle'); c.setAttribute('class','cluster'); c.setAttribute('cx',ov.cluster.x); c.setAttribute('cy',ov.cluster.y); c.setAttribute('r','3.2');
  const t=document.createElementNS(SVGNS,'text'); t.setAttribute('class','cluster-lab'); t.setAttribute('x',ov.cluster.x); t.setAttribute('y',+ov.cluster.y+0.7); t.setAttribute('text-anchor','middle'); t.setAttribute('font-size','2'); t.textContent=ov.cluster.label;
  g.appendChild(halo);g.appendChild(c);g.appendChild(t); cl.appendChild(g);
  g.addEventListener('click',()=>openZoom(ov.cluster.zoom||(M.zoom&&M.zoom[0]&&M.zoom[0].id)));
  g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();openZoom(ov.cluster.zoom||(M.zoom&&M.zoom[0]&&M.zoom[0].id));} });
}
if(ov.clusters){
  const cl=document.getElementById('clusterLayer');
  ov.clusters.forEach(cc=>{
    const g=document.createElementNS(SVGNS,'g'); g.setAttribute('tabindex','0'); g.setAttribute('role','button'); g.setAttribute('aria-label',cc.label+'放大');
    const halo=document.createElementNS(SVGNS,'circle'); halo.setAttribute('class','halo'); halo.setAttribute('cx',cc.x); halo.setAttribute('cy',cc.y); halo.setAttribute('r','2.4');
    const c=document.createElementNS(SVGNS,'circle'); c.setAttribute('class','cluster'); c.setAttribute('cx',cc.x); c.setAttribute('cy',cc.y); c.setAttribute('r','3.4');
    const t=document.createElementNS(SVGNS,'text'); t.setAttribute('class','cluster-lab'); t.setAttribute('x',cc.x); t.setAttribute('y',+cc.y+0.8); t.setAttribute('text-anchor','middle'); t.setAttribute('font-size','2.4'); t.textContent='⊕'+cc.label;
    g.appendChild(halo);g.appendChild(c);g.appendChild(t); cl.appendChild(g);
    g.addEventListener('click',()=>openZoom(cc.zoom));
    g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();openZoom(cc.zoom);} });
  });
}

/* ---- stage chips ---- */
const chips=document.getElementById('stageChips');
function mkChip(id,html){ const b=document.createElement('button'); b.className='chip'; b.id=id; b.innerHTML=html; chips.appendChild(b); return b; }
if(ov.origin){ const b=mkChip('originChip','<span class="dot" style="background:#9c4636"></span>'+(ov.origin.chip||'起始·内行段')); b.onclick=()=>{const on=overlay.classList.toggle('show-origin'); b.classList.toggle('on',on);}; }
if(ov.branch){ const b=mkChip('branchChip','<span class="dot"></span>'+(ov.branch.chip||'显示分支')); b.onclick=()=>{const on=overlay.classList.toggle('show-branch'); b.classList.toggle('on',on);}; }

/* ---- zoom modals ---- */
const zoomHost=document.getElementById('zoomHost');
const zoomEls={};
(M.zoom||[]).forEach(z=>{
  const ZS=(parseFloat((z.viewBox||'0 0 100 100').split(' ')[2])/100)||1;  // window-width scale
  const wrap=document.createElement('div'); wrap.className='zoommodal'; wrap.id='zoom-'+z.id; wrap.setAttribute('role','dialog'); wrap.setAttribute('aria-modal','true');
  wrap.innerHTML =
    '<div class="zoom-inner"><button class="zoom-close" aria-label="关闭">✕</button>'+
    '<h3>'+z.title+'</h3><div class="sub">'+N(z.sub)+'</div>'+
    '<svg class="zsvg" viewBox="'+z.viewBox+'" preserveAspectRatio="xMidYMid meet">'+
      '<defs><filter id="dg-'+z.id+'" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="0.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+
      (z.bg ? z.bg : '<image href="'+IMGS[z.img]+'" x="0" y="0" width="100" height="'+ (z.imgH || z.viewBox.split(' ')[3]) +'" preserveAspectRatio="xMidYMid meet"/>')+
      (z.vessel?'<path class="vessel" d="'+z.vessel+'" opacity="0.85" style="stroke-width:'+(1.3*ZS)+'"/>':'')+
      '<g class="zpts"></g>'+
    '</svg></div>';
  zoomHost.appendChild(wrap);
  zoomEls[z.id]=wrap;
  // points in this modal — scale marker/label to the window width so windowed
  // zooms (viewBox narrower than 100) render dots/text at normal on-screen size
  const gp=wrap.querySelector('.zpts');
  (z.points||[]).forEach(zp=>{
    const p=byCode[zp.code]; if(!p) return;
    const halo=document.createElementNS(SVGNS,'circle'); halo.setAttribute('class','halo'); halo.setAttribute('cx',zp.x); halo.setAttribute('cy',zp.y); halo.setAttribute('r',2.6*ZS);
    const c=document.createElementNS(SVGNS,'circle'); c.setAttribute('class','pt'); c.setAttribute('cx',zp.x); c.setAttribute('cy',zp.y); c.setAttribute('r',2*ZS); c.setAttribute('tabindex','0'); c.setAttribute('role','button'); c.setAttribute('aria-label',p.name+'穴'); c.setAttribute('filter','url(#dg-'+z.id+')'); c.dataset.code=p.code; c.style.strokeWidth=(0.4*ZS);
    const t=document.createElementNS(SVGNS,'text'); t.setAttribute('class','ptlab'); t.setAttribute('x',+zp.x+3.5*ZS); t.setAttribute('y',+zp.y+1.2*ZS); t.setAttribute('text-anchor','start'); t.style.fontSize=(3.5*ZS)+'px'; t.style.strokeWidth=(0.9*ZS)+'px'; t.textContent=p.name+'（'+p.code+'）';
    gp.appendChild(halo);gp.appendChild(c);gp.appendChild(t);
  });
  // declutter: nudge overlapping labels down so dense clusters stay readable
  const labs=[...gp.querySelectorAll('.ptlab')].sort((a,b)=>(+a.getAttribute('y'))-(+b.getAttribute('y')));
  const gap=3.7*ZS; let last=-1e9;
  labs.forEach(t=>{ let y=+t.getAttribute('y'); if(y<last+gap){ y=+(last+gap).toFixed(2); t.setAttribute('y',y); } last=y; });
  wrap.querySelector('.zoom-close').onclick=()=>closeZoom(z.id);
  wrap.addEventListener('click',e=>{ if(e.target===wrap) closeZoom(z.id); });
  // chip
  const b=mkChip('zoomChip-'+z.id, N(z.chip)||'⊕ 放大'); b.onclick=()=>openZoom(z.id);
});
function openZoom(id){ if(id&&zoomEls[id]) zoomEls[id].classList.add('on'); }
function closeZoom(id){ if(id&&zoomEls[id]) zoomEls[id].classList.remove('on'); else Object.values(zoomEls).forEach(w=>w.classList.remove('on')); }

/* 气血流注 canvas */
(function qiFlow(){
  const cv=document.getElementById('qi'), box=document.getElementById('figbox'), img=bodyimg;
  if(!cv||!box) return; const ctx=cv.getContext('2d');
  const VBW=(M.qi&&M.qi.vbw)||100, VBH=(M.qi&&M.qi.vbh)||150;
  const PATH=(M.qi&&M.qi.path)||[];
  if(!PATH.length){ return; }
  let W=0,H=0,dpr=1,poly=[],cum=[],total=0;
  function resize(){ const r=box.getBoundingClientRect(); if(!r.width||!r.height)return;
    dpr=Math.min(window.devicePixelRatio||1,2); W=r.width; H=r.height;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    poly=PATH.map(p=>[p[0]/VBW*W, p[1]/VBH*H]); cum=[0]; total=0;
    for(let i=1;i<poly.length;i++){total+=Math.hypot(poly[i][0]-poly[i-1][0],poly[i][1]-poly[i-1][1]);cum.push(total);} }
  function at(d){ if(d<=0)return poly[0]; if(d>=total)return poly[poly.length-1];
    for(let i=1;i<poly.length;i++){ if(cum[i]>=d){const s=cum[i]-cum[i-1],t=(d-cum[i-1])/s; return [poly[i-1][0]+(poly[i][0]-poly[i-1][0])*t, poly[i-1][1]+(poly[i][1]-poly[i-1][1])*t];}} return poly[poly.length-1]; }
  let parts=[]; const NP=5; for(let i=0;i<NP;i++) parts.push(i/NP);
  let raf=null, running=true;
  function frame(){ if(!W){resize(); if(!W){raf=requestAnimationFrame(frame);return;}}
    ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation='lighter'; const sc=W/VBW;
    for(let i=0;i<parts.length;i++){ parts[i]+=0.0016; if(parts[i]>1)parts[i]-=1;
      for(let k=0;k<9;k++){ let t=parts[i]-k*0.011; if(t<0)t+=1; const p=at(t*total), rad=Math.max((2.9-k*0.28)*sc,0.6), a=(1-k/9)*0.55;
        const g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],rad);
        g.addColorStop(0,'rgba(255,240,196,'+a+')'); g.addColorStop(.4,'rgba(232,200,116,'+(a*0.65)+')'); g.addColorStop(1,'rgba(201,162,75,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p[0],p[1],rad,0,7); ctx.fill(); } }
    ctx.globalCompositeOperation='source-over'; raf = running ? requestAnimationFrame(frame) : null; }
  window.addEventListener('resize',resize);
  if(img){ if(img.complete) resize(); img.addEventListener('load',resize); }
  setTimeout(resize,250); setTimeout(resize,800);
  window.__qi={ start(){ if(!running){running=true; if(!raf)raf=requestAnimationFrame(frame);} }, stop(){ running=false; }, resize };
  raf=requestAnimationFrame(frame);
})();
